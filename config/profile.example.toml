# 화자 설정: 실제 개인정보 대신 모임에서 사용할 가상의 인물을 적습니다.
[persona]
# 글에서 사용할 화자 이름입니다.
name = "가상의 생활 블로거"
# 다루는 전문 분야입니다.
field = "생활"
# 독자의 생활 상황을 설명할 지역입니다.
region = "울산"
# 글이 독자에게 제공할 정보의 목적입니다.
purpose = "일상에서 활용할 수 있는 생활 정보"

# 문체 설정입니다.
[style]
# 초안을 작성할 때 적용할 말투입니다.
tone = "존댓말, 이웃에게 설명하듯"
# 초안 작성 시 이모지를 쓰지 않도록 요청합니다. 점검 강도는 규칙 팩에서 정합니다.
forbid_emoji = true

# 초안의 기계 점검 기준입니다.
[draft]
# 출처 앞 본문에서 공백을 제외한 최소 글자 수입니다.
min_chars = 1200
# 출처 앞 본문에서 공백을 제외한 최대 글자 수입니다.
max_chars = 1800
# 본문에서 '## '로 시작하는 소제목의 개수입니다.
headings = 3
# 출처 구역에서 웹 주소가 들어 있는 줄의 최소 개수입니다.
min_sources = 2
# 사람이 직접 채우고 검수할 경험 슬롯의 최소 개수입니다.
min_human_slots = 2
# 경험 슬롯을 찾는 파이썬 정규식입니다. 작은따옴표는 역슬래시를 보존합니다.
human_slot_pattern = '\[내 경험'

# 함께 적용할 금칙어 묶음입니다.
[rules]
# config/rules 안의 파일 이름에서 .toml을 뺀 값을 적습니다.
packs = ["general_ko"]

# 숏폼 영상의 길이 기준입니다.
[video]
# 목표 재생 시간(초)입니다.
target_seconds = 45
# 목표 시간에서 허용할 차이(초)입니다.
tolerance_seconds = 5

# 작성 프롬프트의 글 종류·점검표·사람 경험 슬롯입니다.
[writing]
genre = "생활 정보"
checklist = "AGENTS.md의 점검표"
experience_label = "내 경험"

# 주제 설정 예시: frame setup topics로 질문에 답하면 내 프로필에 저장됩니다.
# 아래 값은 예시이며 기본적으로 주제 설정 완료로 간주하지 않습니다.
# [topics]
# field = "생활"
# region = "울산"
# audience = "지역 생활 정보를 찾는 이웃"
# seed_keywords = ["정리", "산책", "장보기"] # 3~10개
# exclude = ["광고"] # 제외할 주제, 없으면 []
# issue_sources = [] # 공식 사이트의 RSS 안내에서 직접 복사한 URL만 입력
# cadence_per_week = 2 # 주당 글 수, 1 이상의 정수
